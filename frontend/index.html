<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Opportunity Portal</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; color: #222; }
  header { background: #1f4e78; color: #fff; padding: 16px 24px; }
  header h1 { margin: 0; font-size: 22px; }
  main { max-width: 900px; margin: 20px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 12px;
          box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .card h3 { margin: 0 0 6px; }
  .meta { color: #555; font-size: 14px; margin: 2px 0; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px;
           font-size: 12px; color: #fff; vertical-align: middle; }
  .Open { background: #2e8b57; }
  .Closed { background: #c0392b; }
  button { background: #1f4e78; color: #fff; border: 0; padding: 8px 14px;
           border-radius: 6px; cursor: pointer; font-size: 14px; margin-top: 8px; }
  button:hover { background: #163a5a; }
  button.secondary { background: #6b7785; }
  #message { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; display: none; }
  #message.error { display: block; background: #fdecea; color: #a12622; }
  #message.success { display: block; background: #e6f4ea; color: #1e6b34; }
  .detail-row { margin: 10px 0; }
  .detail-row b { display: inline-block; min-width: 170px; color: #1f4e78; }
</style>
</head>
<body>
<header><h1>Research Opportunity Portal</h1></header>
<main>
  <div id="message"></div>

  <div id="listView">
    <h2>All Opportunities</h2>
    <div id="list"></div>
  </div>

  <div id="detailView" style="display:none"></div>
</main>

<script>
const API = 'http://localhost:3000/api/opportunities';

function showMessage(text, type) {
  const box = document.getElementById('message');
  box.textContent = text;
  box.className = type;
}

function clearMessage() {
  const box = document.getElementById('message');
  box.textContent = '';
  box.className = '';
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function loadOpportunities() {
  const list = document.getElementById('list');
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error('Server returned ' + res.status);
    const items = await res.json();
    if (items.length === 0) {
      list.innerHTML = '<p>No opportunities yet.</p>';
      return;
    }
    list.innerHTML = items.map(o => `
      <div class="card">
        <h3>${esc(o.title)} <span class="badge ${esc(o.status)}">${esc(o.status)}</span></h3>
        <p class="meta">${esc(o.faculty_name)} · ${esc(o.department)}</p>
        <p class="meta">Area: ${esc(o.research_area)} · Positions: ${esc(String(o.positions))} · Deadline: ${esc(o.deadline)}</p>
        <button onclick="viewDetails(${Number(o.id)})">View details</button>
      </div>`).join('');
  } catch (err) {
    showMessage('Could not load opportunities. Is the backend running?', 'error');
  }
}

async function viewDetails(id) {
  clearMessage();
  try {
    const res = await fetch(`${API}/${id}`);
    const o = await res.json();
    if (!res.ok) {
      showMessage(o.error || 'Could not load details', 'error');
      return;
    }
    document.getElementById('detailView').innerHTML = `
      <div class="card">
        <h2>${esc(o.title)} <span class="badge ${esc(o.status)}">${esc(o.status)}</span></h2>
        <div class="detail-row"><b>ID:</b> ${esc(String(o.id))}</div>
        <div class="detail-row"><b>Description:</b> ${esc(o.description)}</div>
        <div class="detail-row"><b>Research area:</b> ${esc(o.research_area)}</div>
        <div class="detail-row"><b>Faculty member:</b> ${esc(o.faculty_name)}</div>
        <div class="detail-row"><b>Department:</b> ${esc(o.department)}</div>
        <div class="detail-row"><b>Required skills:</b> ${esc(o.required_skills)}</div>
        <div class="detail-row"><b>Available positions:</b> ${esc(String(o.positions))}</div>
        <div class="detail-row"><b>Application deadline:</b> ${esc(o.deadline)}</div>
        <button class="secondary" onclick="backToList()">Back to list</button>
      </div>`;
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
  } catch (err) {
    showMessage('Could not reach the backend. Is it running?', 'error');
  }
}

function backToList() {
  clearMessage();
  document.getElementById('detailView').style.display = 'none';
  document.getElementById('listView').style.display = 'block';
  loadOpportunities();
}

loadOpportunities();
</script>
</body>
</html>
